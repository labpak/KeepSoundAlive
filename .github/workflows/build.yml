name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds run on Windows: embedding the icon/manifest into the exe requires it.
          - { rid: win-x64,     os: windows-latest, ext: .exe }
          - { rid: win-arm64,   os: windows-latest, ext: .exe }
          - { rid: linux-x64,   os: ubuntu-24.04,  ext: '' }
          - { rid: linux-arm64, os: ubuntu-24.04,  ext: '' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/KeepSoundAlive/KeepSoundAlive.csproj -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Rename
        shell: bash
        run: |
          mkdir dist
          mv "publish/KeepSoundAlive${{ matrix.ext }}" "dist/KeepSoundAlive-${{ matrix.rid }}${{ matrix.ext }}"
          ls -l dist

      - name: Smoke test (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pulseaudio pulseaudio-utils xvfb libasound2t64 \
            libx11-6 libice6 libsm6 libfontconfig1 > /dev/null
          bash tools/linux-smoke-test.sh dist/KeepSoundAlive-linux-x64

      - name: Smoke test (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $p = Start-Process dist/KeepSoundAlive-win-x64.exe -ArgumentList '--help' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput help.txt
          Get-Content help.txt
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: KeepSoundAlive-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: sed "s/{{TAG}}/${GITHUB_REF_NAME}/g" .github/release-notes.md > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: KeepSoundAlive ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
